# Tests, then builds and publishes the plugin zip when a vX.Y.Z tag is pushed.
# Managed from carmelosantana/kanboard-plugins (templates/workflows/); update it with
# scripts/sync-workflows.sh there rather than by hand.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    uses: carmelosantana/kanboard-plugins/.github/workflows/plugin-test.yml@7ffa429c7d79360d4fe7be31c25ccafb8730fb1d # harness 2026-11-18
  release:
    needs: test
    permissions:
      contents: write
    uses: carmelosantana/kanboard-plugins/.github/workflows/plugin-release.yml@7ffa429c7d79360d4fe7be31c25ccafb8730fb1d # harness 2026-11-18
    with:
      ship-docs: false
